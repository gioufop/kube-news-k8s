apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15.0
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-secret

        # env:
        # - name: POSTGRES_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: postgres-secret
        #       key: POSTGRES_PASSWORD_CONFIG
        # - name: POSTGRES_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: postgres-secret
        #       key: POSTGRES_USER_CONFIG
        # - name: POSTGRES_DB
        #   valueFrom:
        #     secretKeyRef:
        #       name: postgres-secret
        #       key: POSTGRES_DB_CONFIG
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubenews
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubenews
  template:
    metadata:
      labels:
        app: kubenews
    spec:
      containers:
      - name: kubenews
        image: gioufop/kube-news-k8s:v1
        ports:
        - containerPort: 8080
        envFrom:
          - secretRef:
              name: kubenews-secret
        # env:
        # - name: DB_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: kubenews-secret
        #       key: DB_PASSWORD_CONFIG
        # - name: DB_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: kubenews-secret
        #       key: DB_USERNAME_CONFIG
        # - name: DB_DATABASE
        #   valueFrom:
        #     secretKeyRef:
        #       name: kubenews-secret
        #       key: DB_DATABASE_CONFIG
        # - name: DB_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: kubenews-secret
        #       key: DB_HOST_CONFIG
---
apiVersion: v1
kind: Service
metadata:
  name: kubenews
spec:
  selector:
    app: kubenews
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30000
  type: NodePort 